<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Jaden Ninja Run</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #0d1528;
}

button {
    border: 0;
    outline: 0;

    font-family: Arial, sans-serif;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;
}


/* =========================
   MENU
========================= */

#menu {

    width: 100%;
    height: 100vh;

    padding: 45px 20px;

    text-align: center;

    color: white;

    background: #0d1528;
}

#menu h1 {

    margin: 0;

    color: #ffd43b;

    font-size: 48px;

    letter-spacing: 4px;
}

#menu h2 {

    margin: 0 0 40px;

    font-size: 24px;

    letter-spacing: 7px;
}

#menu p {

    margin: 0 0 25px;

    color: #aeb6c7;

    font-size: 23px;
}


/* =========================
   PERSONNAGES
========================= */

.characters {

    display: flex;

    gap: 10px;

    width: 100%;

    max-width: 700px;

    margin: auto;
}

.character {

    position: relative;

    flex: 1;

    height: 205px;

    border: 3px solid #303d55;

    border-radius: 25px;

    background: #202c40;

    color: white;

    touch-action: manipulation;
}

.character.selected {

    border-color: #ffd43b;

    background: #2c394f;
}

.character strong {

    position: absolute;

    bottom: 18px;

    left: 0;

    width: 100%;

    font-size: 18px;
}


/* personnages dessinés */

.person {

    position: absolute;

    left: 50%;
    top: 15px;

    width: 70px;
    height: 120px;

    transform: translateX(-50%);
}

.head {

    width: 50px;
    height: 50px;

    margin: auto;

    border-radius: 50%;

    background: #dfa06e;

    border: 4px solid #151b29;
}

.body {

    width: 55px;
    height: 55px;

    margin: -2px auto;

    border-radius: 10px;

    background: #263c79;
}

.legs {

    display: flex;

    justify-content: space-between;

    width: 45px;

    margin: auto;
}

.legs i {

    width: 18px;
    height: 32px;

    border-radius: 0 0 8px 8px;

    background: #151b29;
}

.shadow .head {
    background: #888f9e;
}

.shadow .body {
    background: #111827;
}

.fire .body {
    background: #c83d26;
}


/* =========================
   JOUER
========================= */

#playButton {

    display: block;

    width: 100%;

    max-width: 700px;

    height: 95px;

    margin: 45px auto 0;

    border-radius: 25px;

    background: #ffd43b;

    color: #111;

    font-size: 30px;

    font-weight: bold;
}

#playButton:active {

    transform: scale(.97);
}


/* =========================
   JEU
========================= */

#game {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            #111a32,
            #334e75
        );
}


/* score */

#scoreBoard {

    position: absolute;

    top: 20px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    z-index: 20;
}

.scoreBox {

    display: flex;

    flex-direction: column;

    font-size: 12px;

    font-weight: bold;
}

.scoreBox b {

    font-size: 25px;
}


/* joueur */

#player {

    position: absolute;

    left: 15%;

    bottom: 90px;

    width: 70px;
    height: 70px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 55px;

    z-index: 10;
}

.jump {

    animation: jumpAnimation .65s ease-out;
}

@keyframes jumpAnimation {

    0% {
        bottom: 90px;
    }

    50% {
        bottom: 270px;
    }

    100% {
        bottom: 90px;
    }
}


/* obstacle */

#obstacle {

    position: absolute;

    left: 100%;

    bottom: 90px;

    font-size: 55px;

    z-index: 9;
}


/* sol */

#ground {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 90px;

    background:
        repeating-linear-gradient(
            135deg,
            #171717 0,
            #171717 25px,
            #272727 25px,
            #272727 50px
        );

    border-top: 5px solid #ffd43b;
}


/* bouton saut */

#jumpButton {

    position: absolute;

    right: 20px;
    bottom: 110px;

    width: 135px;
    height: 70px;

    border: 3px solid white;

    border-radius: 40px;

    background: #ffd43b;

    color: #111;

    font-size: 18px;

    font-weight: bold;

    z-index: 50;
}

#jumpButton:active {

    transform: scale(.9);
}


/* =========================
   GAME OVER
========================= */

#gameOver {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(5,8,15,.95);

    color: white;

    z-index: 100;
}

#gameOver h2 {

    font-size: 45px;

    margin: 0 0 15px;
}

#gameOver p {

    font-size: 25px;
}

#gameOver button {

    width: 80%;

    max-width: 400px;

    height: 65px;

    margin: 7px;

    border-radius: 18px;

    background: #ffd43b;

    font-size: 21px;

    font-weight: bold;
}

#menuButton {

    background: #293750 !important;

    color: white;
}


/* =========================
   CACHÉ
========================= */

.hidden {
    display: none !important;
}


/* =========================
   PETITS ÉCRANS
========================= */

@media (max-height: 650px) {

    #menu {
        padding-top: 20px;
    }

    #menu h2 {
        margin-bottom: 20px;
    }

    .character {
        height: 160px;
    }

    #playButton {
        margin-top: 20px;
        height: 70px;
    }

}

</style>

</head>


<body>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <h1>JADEN</h1>

    <h2>N I N J A  R U N</h2>

    <p>Choisis ton ninja</p>


    <div class="characters">


        <button class="character selected"
                data-character="ninja">

            <div class="person">

                <div class="head"></div>

                <div class="body"></div>

                <div class="legs">
                    <i></i>
                    <i></i>
                </div>

            </div>

            <strong>NINJA</strong>

        </button>


        <button class="character"
                data-character="shadow">

            <div class="person shadow">

                <div class="head"></div>

                <div class="body"></div>

                <div class="legs">
                    <i></i>
                    <i></i>
                </div>

            </div>

            <strong>SHADOW</strong>

        </button>


        <button class="character"
                data-character="fire">

            <div class="person fire">

                <div class="head"></div>

                <div class="body"></div>

                <div class="legs">
                    <i></i>
                    <i></i>
                </div>

            </div>

            <strong>FIRE</strong>

        </button>


    </div>


    <button id="playButton">
        JOUER
    </button>

</div>



<!-- =========================
     JEU
========================= -->

<div id="game" class="hidden">


    <div id="scoreBoard">

        <div class="scoreBox">
            SCORE
            <b id="score">0</b>
        </div>

        <div class="scoreBox">
            RECORD
            <b id="best">0</b>
        </div>

    </div>


    <div id="player">
        🥷
    </div>


    <div id="obstacle">
        🪨
    </div>


    <div id="ground"></div>


    <button id="jumpButton">
        SAUTER
    </button>


</div>



<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver" class="hidden">

    <h2>GAME OVER</h2>

    <p>
        Score :
        <b id="finalScore">0</b>
    </p>

    <button id="retryButton">
        REJOUER
    </button>

    <button id="menuButton">
        MENU
    </button>

</div>



<script>

/* =====================================
   RÉCUPÉRATION DES ÉLÉMENTS
===================================== */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const gameOver =
    document.getElementById("gameOver");

const playButton =
    document.getElementById("playButton");

const jumpButton =
    document.getElementById("jumpButton");

const retryButton =
    document.getElementById("retryButton");

const menuButton =
    document.getElementById("menuButton");

const player =
    document.getElementById("player");

const obstacle =
    document.getElementById("obstacle");

const scoreElement =
    document.getElementById("score");

const bestElement =
    document.getElementById("best");

const finalScore =
    document.getElementById("finalScore");

const characters =
    document.querySelectorAll(".character");


/* =====================================
   VARIABLES
===================================== */

let selectedCharacter = "ninja";

let playing = false;

let score = 0;

let best =
    Number(localStorage.getItem("jadenBest")) || 0;

let obstacleX = 0;

let speed = 7;

let lastTime = 0;


/* =====================================
   RECORD
===================================== */

bestElement.textContent = best;


/* =====================================
   CHOIX DU PERSONNAGE
===================================== */

characters.forEach(function(character) {

    character.addEventListener(
        "click",
        function() {

            characters.forEach(function(c) {

                c.classList.remove("selected");

            });


            character.classList.add("selected");


            selectedCharacter =
                character.dataset.character;

        }
    );

});


/* =====================================
   BOUTON JOUER
===================================== */

playButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* =====================================
   DÉMARRER
===================================== */

function startGame() {

    console.log("START GAME");

    playing = true;

    score = 0;

    speed = 7;

    obstacleX =
        window.innerWidth + 100;


    scoreElement.textContent = "0";


    menu.classList.add("hidden");

    game.classList.remove("hidden");

    gameOver.classList.add("hidden");


    changeCharacter();


    player.classList.remove("jump");


    lastTime =
        performance.now();


    requestAnimationFrame(gameLoop);

}


/* =====================================
   PERSONNAGE
===================================== */

function changeCharacter() {

    if (selectedCharacter === "ninja") {

        player.textContent = "🥷";

    }

    else if (selectedCharacter === "shadow") {

        player.textContent = "👤";

    }

    else {

        player.textContent = "🔥";

    }

}


/* =====================================
   SAUT
===================================== */

function jump() {

    if (!playing) {
        return;
    }


    if (player.classList.contains("jump")) {
        return;
    }


    player.classList.add("jump");


    setTimeout(function() {

        player.classList.remove("jump");

    }, 650);

}


/* =====================================
   BOUTON SAUT
===================================== */

jumpButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        jump();

    }
);


/* =====================================
   CLAVIER
===================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/* =====================================
   BOUCLE
===================================== */

function gameLoop(time) {

    if (!playing) {
        return;
    }


    let delta =
        time - lastTime;


    lastTime = time;


    /* déplacement */

    obstacleX -=
        speed * (delta / 16.67);


    obstacle.style.left =
        obstacleX + "px";


    /* nouvel obstacle */

    if (obstacleX < -100) {

        obstacleX =
            window.innerWidth +
            150 +
            Math.random() * 300;

    }


    /* score */

    score +=
        delta * 0.01;


    let currentScore =
        Math.floor(score);


    scoreElement.textContent =
        currentScore;


    /* difficulté */

    speed =
        Math.min(
            15,
            7 + currentScore * 0.025
        );


    /* collision */

    if (checkCollision()) {

        endGame();

        return;

    }


    requestAnimationFrame(gameLoop);

}


/* =====================================
   COLLISION
===================================== */

function checkCollision() {

    let p =
        player.getBoundingClientRect();

    let o =
        obstacle.getBoundingClientRect();


    let margin = 15;


    return (

        p.right - margin > o.left &&

        p.left + margin < o.right &&

        p.bottom - margin > o.top &&

        p.top + margin < o.bottom

    );

}


/* =====================================
   GAME OVER
===================================== */

function endGame() {

    playing = false;


    let final =
        Math.floor(score);


    finalScore.textContent =
        final;


    if (final > best) {

        best = final;

        localStorage.setItem(
            "jadenBest",
            best
        );

        bestElement.textContent =
            best;

    }


    gameOver.classList.remove("hidden");

}


/* =====================================
   REJOUER
===================================== */

retryButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* =====================================
   MENU
===================================== */

menuButton.addEventListener(
    "click",
    function() {

        playing = false;

        game.classList.add("hidden");

        gameOver.classList.add("hidden");

        menu.classList.remove("hidden");

    }
);

</script>

</body>
</html>
