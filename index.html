<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jaden Ninja Run</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101a31;
  font-family:Arial,sans-serif;
  touch-action:none;
}

button{
  font:inherit;
  border:0;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#74c9f5;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  color:white;
  font-weight:900;
  font-size:18px;
  text-shadow:2px 2px 3px #101a31;
  pointer-events:none;
}

.box{
  background:#10203dcc;
  padding:7px 12px;
  border-radius:14px;
}

#controls{
  position:fixed;
  left:14px;
  right:14px;
  bottom:max(12px,env(safe-area-inset-bottom));
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.side{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.btn{
  width:68px;
  height:68px;
  border:3px solid white;
  border-radius:50%;
  background:#17243dcc;
  color:white;
  font-size:30px;
  font-weight:900;
  box-shadow:0 4px 12px #0006;
}

#jump{
  width:108px;
  height:68px;
  border-radius:36px;
  background:#ffd43b;
  color:#111;
  font-size:19px;
}

#menu,
#end{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:linear-gradient(#101a31,#294d76);
}

#menu h1{
  font-size:clamp(42px,10vw,72px);
  color:#ffd43b;
  letter-spacing:5px;
  text-shadow:4px 4px #111;
}

#menu h2{
  letter-spacing:6px;
  margin:4px 0 15px;
}

#menu p{
  max-width:500px;
  line-height:1.5;
  color:#dce7f5;
  margin:0 20px 22px;
}

.big{
  width:240px;
  height:62px;
  border-radius:18px;
  background:#ffd43b;
  color:#111;
  font-size:23px;
  font-weight:900;
}

#end h2{
  font-size:40px;
  margin-bottom:10px;
}

#end p{
  margin-bottom:18px;
}

.hidden{
  display:none!important;
}

/* ÉCRAN PORTRAIT */

#rotate{
  position:fixed;
  inset:0;
  z-index:100;
  background:#101a31;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

#rotate .card{
  max-width:390px;
  background:#1d3153;
  border:2px solid #4e6d97;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 12px 35px #0007;
}

#rotate .icon{
  font-size:64px;
  display:block;
  margin-bottom:15px;
}

#rotate h2{
  font-size:28px;
  margin-bottom:10px;
}

#rotate p{
  line-height:1.5;
  color:#dbe7f5;
}

/* Force le message en portrait */

@media (orientation:portrait){
  #rotate{
    display:flex;
  }
}

@media(min-width:900px){
  #controls{
    max-width:900px;
    margin:auto;
  }
}
</style>
</head>

<body>

<!-- MESSAGE MODE PAYSAGE -->

<div id="rotate">

  <div class="card">

    <span class="icon">📱↔️</span>

    <h2>Tourne ton téléphone</h2>

    <p>
      Jaden Ninja Run se joue en mode paysage.
      Mets ton téléphone à l'horizontale pour jouer.
    </p>

  </div>

</div>


<!-- JEU -->

<div id="game">

  <canvas id="canvas"></canvas>


  <!-- SCORE -->

  <div id="hud">

    <div class="box">
      ❤️ <span id="lives">3</span>
      &nbsp;
      🪙 <span id="coins">0</span>
    </div>

    <div class="box">
      SCORE <span id="score">0</span>
    </div>

  </div>


  <!-- CONTROLES -->

  <div id="controls">

    <div class="side">

      <button class="btn" id="left">
        ◀
      </button>

      <button class="btn" id="right">
        ▶
      </button>

    </div>

    <button class="btn" id="jump">
      SAUTER
    </button>

  </div>

</div>


<!-- MENU -->

<div id="menu">

  <h1>JADEN</h1>

  <h2>NINJA RUN</h2>

  <p>
    Jeu de plateforme ninja original :
    cours, saute, récupère les pièces
    et atteins le drapeau.
  </p>

  <button class="big" id="play">
    JOUER
  </button>

</div>


<!-- FIN -->

<div id="end" class="hidden">

  <h2 id="endTitle">
    GAME OVER
  </h2>

  <p id="endText"></p>

  <button class="big" id="again">
    REJOUER
  </button>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const end =
document.getElementById("end");

const play =
document.getElementById("play");

const again =
document.getElementById("again");

const livesEl =
document.getElementById("lives");

const coinsEl =
document.getElementById("coins");

const scoreEl =
document.getElementById("score");

const endTitle =
document.getElementById("endTitle");

const endText =
document.getElementById("endText");


let W = innerWidth;
let H = innerHeight;

let dpr = 1;

let state = "menu";

let raf = 0;

const WORLD_W = 5200;

let groundY = H - 105;

let camera = 0;

let lives = 3;

let coins = 0;

let score = 0;

let jumpBuffer = 0;


const player = {

  x:90,

  y:0,

  w:38,

  h:52,

  vx:0,

  vy:0,

  grounded:false,

  coyote:0,

  inv:0

};


const input = {

  left:false,

  right:false,

  jump:false

};


/* PLATEFORMES */

const platformDefs = [

  {x:330,w:180,dy:105},

  {x:610,w:155,dy:175},

  {x:900,w:220,dy:110},

  {x:1230,w:180,dy:210},

  {x:1530,w:210,dy:125},

  {x:1840,w:150,dy:205},

  {x:2110,w:250,dy:110},

  {x:2500,w:190,dy:245},

  {x:2820,w:230,dy:135},

  {x:3200,w:180,dy:215},

  {x:3510,w:250,dy:115},

  {x:3900,w:180,dy:235},

  {x:4210,w:260,dy:135}

];


const gapDefs = [

  [780,900],

  [1400,1530],

  [1990,2110],

  [2760,2820],

  [3040,3200],

  [3760,3900],

  [4490,4620]

];


let platforms = [];

let gaps = [];

let coinsData = [];

let enemies = [];


/* =========================
   RESIZE
========================= */

function resize(){

  W = innerWidth;

  H = innerHeight;

  dpr =
  Math.min(
    devicePixelRatio || 1,
    2
  );

  canvas.width =
  Math.floor(W * dpr);

  canvas.height =
  Math.floor(H * dpr);

  canvas.style.width =
  W + "px";

  canvas.style.height =
  H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  groundY =
  H - 105;

  buildLevel();

}


addEventListener(
  "resize",
  resize
);


addEventListener(
  "orientationchange",
  () => {
    setTimeout(
      resize,
      100
    );
  }
);


/* =========================
   CREATION DU NIVEAU
========================= */

function buildLevel(){

  platforms =
  platformDefs.map(
    p => ({
      x:p.x,
      y:groundY-p.dy,
      w:p.w,
      h:18
    })
  );


  gaps =
  gapDefs.map(
    g => ({
      x:g[0],
      w:g[1]-g[0]
    })
  );


  coinsData = [

    {x:380,y:groundY-150,taken:false},

    {x:450,y:groundY-150,taken:false},

    {x:675,y:groundY-220,taken:false},

    {x:730,y:groundY-220,taken:false},

    {x:980,y:groundY-155,taken:false},

    {x:1040,y:groundY-155,taken:false},

    {x:1290,y:groundY-260,taken:false},

    {x:1360,y:groundY-260,taken:false},

    {x:1580,y:groundY-170,taken:false},

    {x:1640,y:groundY-170,taken:false},

    {x:2170,y:groundY-155,taken:false},

    {x:2240,y:groundY-155,taken:false},

    {x:2550,y:groundY-295,taken:false},

    {x:2620,y:groundY-295,taken:false},

    {x:3260,y:groundY-265,taken:false},

    {x:3560,y:groundY-165,taken:false},

    {x:3950,y:groundY-285,taken:false},

    {x:4280,y:groundY-185,taken:false}

  ];


  enemies = [

    {
      x:560,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:500,
      max:740,
      dead:false
    },

    {
      x:1120,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:1060,
      max:1190,
      dead:false
    },

    {
      x:1720,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:1580,
      max:1810,
      dead:false
    },

    {
      x:2300,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:2140,
      max:2420,
      dead:false
    },

    {
      x:3350,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:3240,
      max:3460,
      dead:false
    },

    {
      x:4430,
      y:groundY-38,
      w:38,
      h:38,
      vx:55,
      min:4250,
      max:4470,
      dead:false
    }

  ];

}


/* =========================
   DEMARRER
========================= */

function startGame(){

  if(innerWidth > innerHeight){

    if(
      document.documentElement.requestFullscreen
    ){

      document.documentElement
        .requestFullscreen()
        .catch(()=>{});

    }


    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      screen.orientation
        .lock("landscape")
        .catch(()=>{});

    }

  }


  menu.classList.add("hidden");

  end.classList.add("hidden");

  state = "playing";

  lives = 3;

  coins = 0;

  score = 0;

  camera = 0;

  jumpBuffer = 0;


  player.x = 90;

  player.y =
  groundY - player.h;

  player.vx = 0;

  player.vy = 0;

  player.grounded = true;

  player.coyote = .1;

  player.inv = 0;


  buildLevel();

  updateHUD();

  cancelAnimationFrame(raf);

  raf =
  requestAnimationFrame(loop);

}


play.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    startGame();

  }
);


again.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    startGame();

  }
);


/* =========================
   CONTROLES GAUCHE / DROITE
========================= */

function bindHold(id,key){

  const b =
  document.getElementById(id);


  const down =
  e => {

    e.preventDefault();

    input[key] = true;

  };


  const up =
  e => {

    e.preventDefault();

    input[key] = false;

  };


  b.addEventListener(
    "pointerdown",
    down
  );

  b.addEventListener(
    "pointerup",
    up
  );

  b.addEventListener(
    "pointercancel",
    up
  );

  b.addEventListener(
    "pointerleave",
    up
  );

  b.addEventListener(
    "lostpointercapture",
    up
  );

}


bindHold(
  "left",
  "left"
);


bindHold(
  "right",
  "right"
);


/* =========================
   SAUT
========================= */

const jumpBtn =
document.getElementById("jump");


jumpBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    input.jump = true;

    jumpBuffer = .14;

  }
);


[
  "pointerup",
  "pointercancel",
  "pointerleave",
  "lostpointercapture"
].forEach(
  ev => {

    jumpBtn.addEventListener(
      ev,
      e => {

        e.preventDefault();

        input.jump = false;

      }
    );

  }
);


/* =========================
   CLAVIER
========================= */

addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.left = true;

    }


    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.right = true;

    }


    if(
      e.key === " " ||
      e.key === "ArrowUp" ||
      e.key.toLowerCase() === "w"
    ){

      e.preventDefault();

      jumpBuffer = .14;

      input.jump = true;

    }

  }
);


addEventListener(
  "keyup",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.left = false;

    }


    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.right = false;

    }


    if(
      e.key === " " ||
      e.key === "ArrowUp" ||
      e.key.toLowerCase() === "w"
    ){

      input.jump = false;

    }

  }
);


/* =========================
   COLLISION
========================= */

function overlaps(a,b){

  return (

    a.x < b.x+b.w &&

    a.x+a.w > b.x &&

    a.y < b.y+b.h &&

    a.y+a.h > b.y

  );

}


/* =========================
   SOL
========================= */

function groundAt(x){

  for(
    const g of gaps
  ){

    if(
      x > g.x &&
      x < g.x+g.w
    ){

      return false;

    }

  }

  return true;

}


/* =========================
   PHYSIQUE
========================= */

function update(dt){

  jumpBuffer =
  Math.max(
    0,
    jumpBuffer-dt
  );


  player.inv =
  Math.max(
    0,
    player.inv-dt
  );


  player.coyote =
  Math.max(
    0,
    player.coyote-dt
  );


  /* déplacement */

  if(
    input.left &&
    !input.right
  ){

    player.vx -=
    900*dt;

  }

  else if(
    input.right &&
    !input.left
  ){

    player.vx +=
    900*dt;

  }

  else{

    player.vx *=
    Math.pow(.001,dt);

  }


  player.vx =
  Math.max(
    -290,
    Math.min(
      290,
      player.vx
    )
  );


  /* saut */

  if(
    jumpBuffer > 0 &&
    (
      player.grounded ||
      player.coyote > 0
    )
  ){

    player.vy = -610;

    player.grounded = false;

    player.coyote = 0;

    jumpBuffer = 0;

  }


  if(
    !input.jump &&
    player.vy < 0
  ){

    player.vy +=
    1500*dt;

  }


  const oldY =
  player.y;


  player.x +=
  player.vx*dt;


  player.x =
  Math.max(
    0,
    Math.min(
      WORLD_W-player.w,
      player.x
    )
  );


  player.vy +=
  1650*dt;


  player.y +=
  player.vy*dt;


  player.grounded = false;


  let landed = false;


  /* sol */

  if(
    player.vy >= 0
  ){

    if(

      groundAt(
        player.x+
        player.w*.5
      ) &&

      oldY+
      player.h <=
      groundY &&

      player.y+
      player.h >=
      groundY

    ){

      player.y =
      groundY-player.h;

      player.vy = 0;

      player.grounded =
      true;

      landed = true;

    }


    /* plateformes */

    for(
      const p of platforms
    ){

      if(

        player.x+
        player.w > p.x &&

        player.x < p.x+p.w &&

        oldY+
        player.h <= p.y &&

        player.y+
        player.h >= p.y

      ){

        player.y =
        p.y-player.h;

        player.vy = 0;

        player.grounded =
        true;

        landed = true;

        break;

      }

    }

  }


  /* tombe dans un trou */

  if(
    !landed &&
    player.y > H+220
  ){

    loseLife();

    return;

  }


  /* pièces */

  for(
    const c of coinsData
  ){

    if(c.taken)
      continue;


    const dx =
    player.x+
    player.w/2-c.x;


    const dy =
    player.y+
    player.h/2-c.y;


    if(
      dx*dx+
      dy*dy <
      34*34
    ){

      c.taken = true;

      coins++;

      score += 50;

    }

  }


  /* ennemis */

  for(
    const e of enemies
  ){

    if(e.dead)
      continue;


    e.x +=
    e.vx*dt;


    if(
      e.x < e.min ||
      e.x > e.max
    ){

      e.vx *= -1;

      e.x =
      Math.max(
        e.min,
        Math.min(
          e.max,
          e.x
        )
      );

    }


    const eb = {

      x:e.x,

      y:e.y,

      w:e.w,

      h:e.h

    };


    if(
      overlaps(
        player,
        eb
      ) &&
      player.inv <= 0
    ){

      /* ennemi écrasé */

      if(
        player.vy > 120 &&
        player.y+
        player.h <
        e.y+e.h
      ){

        e.dead = true;

        player.vy = -420;

        score += 100;

      }

      else{

        loseLife();

        return;

      }

    }

  }


  /* arrivée */

  if(
    player.x >= 4850
  ){

    finish(true);

    return;

  }


  score +=
  dt*4;


  /* caméra */

  camera =
  player.x-
  W*.34;


  camera =
  Math.max(
    0,
    Math.min(
      WORLD_W-W,
      camera
    )
  );


  updateHUD();

}


/* =========================
   PERDRE UNE VIE
========================= */

function loseLife(){

  if(
    player.inv > 0
  )
    return;


  lives--;


  if(
    lives <= 0
  ){

    finish(false);

    return;

  }


  player.x =
  Math.max(
    90,
    player.x-280
  );


  player.y =
  groundY-player.h;


  player.vx = 0;

  player.vy = 0;

  player.grounded = true;

  player.inv = 2;


  camera =
  Math.max(
    0,
    player.x-W*.34
  );


  updateHUD();

}


/* =========================
   FIN DU JEU
========================= */

function finish(win){

  state =
  win
  ? "win"
  : "gameover";


  end.classList.remove(
    "hidden"
  );


  endTitle.textContent =
  win
  ? "🏆 NIVEAU TERMINÉ !"
  : "GAME OVER";


  endText.textContent =
  "Score : "+
  Math.floor(score)+
  " • Pièces : "+
  coins;

}


/* =========================
   HUD
========================= */

function updateHUD(){

  livesEl.textContent =
  lives;

  coinsEl.textContent =
  coins;

  scoreEl.textContent =
  Math.floor(score);

}


/* =========================
   DECOR
========================= */

function drawBackground(){

  const sky =
  ctx.createLinearGradient(
    0,0,0,H
  );


  sky.addColorStop(
    0,
    "#61bce9"
  );


  sky.addColorStop(
    .65,
    "#bcecff"
  );


  sky.addColorStop(
    1,
    "#7cc85b"
  );


  ctx.fillStyle =
  sky;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* nuages */

  ctx.fillStyle =
  "#ffffff99";


  for(
    let i=0;
    i<7;
    i++
  ){

    const cx =
    (
      i*260-
      camera*.12
    ) %
    (W+260)-130;


    const cy =
    70+
    (i%3)*55;


    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      24,
      0,
      Math.PI*2
    );

    ctx.arc(
      cx+28,
      cy+4,
      30,
      0,
      Math.PI*2
    );

    ctx.arc(
      cx+62,
      cy,
      21,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* montagnes */

  ctx.fillStyle =
  "#78a8a0";


  for(
    let i=0;
    i<9;
    i++
  ){

    const x =
    (
      i*430-
      camera*.18
    ) %
    (W+500)-250;


    ctx.beginPath();

    ctx.moveTo(
      x,
      H-105
    );

    ctx.lineTo(
      x+210,
      H-280
    );

    ctx.lineTo(
      x+410,
      H-105
    );

    ctx.closePath();

    ctx.fill();

  }


  ctx.fillStyle =
  "#568e66";


  for(
    let i=0;
    i<8;
    i++
  ){

    const x =
    (
      i*560-
      camera*.28
    ) %
    (W+600)-300;


    ctx.beginPath();

    ctx.moveTo(
      x,
      H-105
    );

    ctx.lineTo(
