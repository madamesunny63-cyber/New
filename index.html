<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Jaden Ninja Run</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#10182b;
}

button{
    border:0;
    font:inherit;
    touch-action:none;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    background:linear-gradient(#10182b,#263d61);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:100;
}

#menu h1{
    color:#ffd43b;
    font-size:50px;
    letter-spacing:5px;
}

#menu h2{
    margin:5px 0 25px;
    letter-spacing:6px;
}

#menu p{
    color:#ccd3df;
    margin-bottom:25px;
}

#play{
    width:260px;
    height:70px;
    border-radius:18px;
    background:#ffd43b;
    color:#111;
    font-size:25px;
    font-weight:bold;
}

.hidden{
    display:none!important;
}

/* ================= JEU ================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(#6cc7ff 0%,#bceaff 65%,#72c454 65%);
}

/* décor */

.cloud{
    position:absolute;
    width:130px;
    height:35px;
    background:white;
    opacity:.7;
    border-radius:30px;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:20px;
    bottom:0;
}

.cloud:after{
    width:65px;
    height:65px;
    right:15px;
    bottom:0;
}

.c1{
    top:12%;
    left:10%;
}

.c2{
    top:22%;
    left:65%;
}

/* ================= MONDE ================= */

#world{
    position:absolute;
    left:0;
    top:0;
    width:5000px;
    height:100%;
}

/* sol */

.ground{
    position:absolute;
    left:0;
    bottom:0;
    width:5000px;
    height:75px;

    background:
    repeating-linear-gradient(
        45deg,
        #267a36 0 25px,
        #318c3f 25px 50px
    );

    border-top:6px solid #155323;
}

/* plateformes */

.platform{
    position:absolute;
    height:28px;

    background:
    linear-gradient(
        #965c2c,
        #6b391c
    );

    border:4px solid #4b2716;
    border-radius:7px;
}

/* blocs */

.block{
    position:absolute;
    width:60px;
    height:60px;

    background:#e7a52e;

    border:4px solid #a96d13;

    border-radius:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
}

/* ================= JOUEUR ================= */

#player{
    position:absolute;

    width:55px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;

    z-index:20;
}

/* ================= PIECES ================= */

.coin{
    position:absolute;

    width:30px;
    height:30px;

    border-radius:50%;

    background:#ffd43b;

    border:4px solid #d79500;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;

    animation:coin 0.6s infinite alternate;
}

@keyframes coin{
    from{transform:scale(.85)}
    to{transform:scale(1.1)}
}

/* ================= ENNEMIS ================= */

.enemy{
    position:absolute;

    width:55px;
    height:45px;

    border-radius:20px 20px 10px 10px;

    background:#c73737;

    border:4px solid #751d1d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    z-index:15;
}

/* ================= DRAPEAU ================= */

.flag{
    position:absolute;

    width:12px;
    height:230px;

    background:#222;

    z-index:10;
}

.flag:before{
    content:"";

    position:absolute;

    left:10px;
    top:0;

    width:100px;
    height:65px;

    background:#ffd43b;

    clip-path:polygon(
        0 0,
        100% 20%,
        75% 50%,
        100% 80%,
        0 100%
    );
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;

    color:white;

    font-weight:bold;

    z-index:50;

    text-shadow:2px 2px #111;
}

#hud span{
    margin-right:18px;
}

/* ================= CONTROLES ================= */

.controls{
    position:fixed;

    left:20px;
    right:20px;
    bottom:20px;

    display:flex;
    justify-content:space-between;

    z-index:60;
}

.leftControls{
    display:flex;
    gap:12px;
}

.control{
    width:72px;
    height:72px;

    border-radius:50%;

    background:rgba(0,0,0,.55);

    border:3px solid white;

    color:white;

    font-size:30px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.jump{
    width:90px;
    height:90px;

    background:rgba(255,190,0,.85);

    color:#111;

    font-size:22px;

    font-weight:bold;
}

/* ================= GAME OVER ================= */

#message{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.75);

    z-index:100;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:white;
    text-align:center;
}

#message h2{
    font-size:45px;
    margin-bottom:15px;
}

#message button{
    margin-top:20px;

    width:250px;
    height:65px;

    border-radius:15px;

    background:#ffd43b;

    font-size:22px;
    font-weight:bold;
}

/* ================= PC ================= */

@media(min-width:800px){

    .controls{
        max-width:800px;
        margin:auto;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <h1>JADEN</h1>

    <h2>NINJA RUN</h2>

    <p>Une aventure ninja commence...</p>

    <button id="play">
        JOUER
    </button>

</div>


<!-- JEU -->

<div id="game" class="hidden">

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div id="hud">

        <div>
            ❤️ <span id="lives">3</span>
            🪙 <span id="coins">0</span>
        </div>

        <div>
            SCORE <span id="score">0</span>
        </div>

    </div>


    <div id="world">

        <div class="ground"></div>

        <!-- plateformes -->

        <div class="platform"
             style="left:450px;bottom:190px;width:220px">
        </div>

        <div class="platform"
             style="left:850px;bottom:270px;width:180px">
        </div>

        <div class="platform"
             style="left:1200px;bottom:180px;width:250px">
        </div>

        <div class="platform"
             style="left:1650px;bottom:250px;width:180px">
        </div>

        <div class="platform"
             style="left:2050px;bottom:190px;width:250px">
        </div>

        <div class="platform"
             style="left:2500px;bottom:300px;width:200px">
        </div>


        <!-- blocs -->

        <div class="block"
             style="left:700px;bottom:75px">
            ?
        </div>

        <div class="block"
             style="left:760px;bottom:75px">
            ?
        </div>


        <!-- pièces -->

        <div class="coin"
             style="left:500px;bottom:240px">
            $
        </div>

        <div class="coin"
             style="left:560px;bottom:240px">
            $
        </div>

        <div class="coin"
             style="left:620px;bottom:240px">
            $
        </div>

        <div class="coin"
             style="left:900px;bottom:330px">
            $
        </div>

        <div class="coin"
             style="left:960px;bottom:330px">
            $
        </div>

        <div class="coin"
             style="left:1300px;bottom:230px">
            $
        </div>

        <div class="coin"
             style="left:1360px;bottom:230px">
            $
        </div>


        <!-- ennemis -->

        <div class="enemy"
             style="left:600px;bottom:75px">
            👾
        </div>

        <div class="enemy"
             style="left:1100px;bottom:75px">
            👾
        </div>

        <div class="enemy"
             style="left:1550px;bottom:75px">
            👾
        </div>

        <div class="enemy"
             style="left:2200px;bottom:75px">
            👾
        </div>


        <!-- arrivée -->

        <div class="flag"
             style="left:3100px;bottom:75px">
        </div>


        <!-- joueur -->

        <div id="player"
             style="left:100px;bottom:75px">
            🥷
        </div>

    </div>


    <!-- contrôles -->

    <div class="controls">

        <div class="leftControls">

            <button
                class="control"
                id="left">
                ◀
            </button>

            <button
                class="control"
                id="right">
                ▶
            </button>

        </div>

        <button
            class="control jump"
            id="jump">
            SAUT
        </button>

    </div>

</div>


<!-- GAME OVER / VICTOIRE -->

<div id="message" class="hidden">

    <h2 id="messageTitle">
        GAME OVER
    </h2>

    <p id="messageText">
        Score : 0
    </p>

    <button id="restart">
        REJOUER
    </button>

</div>


<script>

/* =====================================
   ELEMENTS
===================================== */

const menu =
document.getElementById("menu");

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const player =
document.getElementById("player");

const play =
document.getElementById("play");

const leftButton =
document.getElementById("left");

const rightButton =
document.getElementById("right");

const jumpButton =
document.getElementById("jump");

const message =
document.getElementById("message");

const messageTitle =
document.getElementById("messageTitle");

const messageText =
document.getElementById("messageText");

const restart =
document.getElementById("restart");

const scoreElement =
document.getElementById("score");

const coinsElement =
document.getElementById("coins");

const livesElement =
document.getElementById("lives");


/* =====================================
   VARIABLES
===================================== */

let x = 100;

let y = 75;

let velocityY = 0;

let velocityX = 0;

let grounded = true;

let cameraX = 0;

let playing = false;

let lives = 3;

let coins = 0;

let score = 0;

let keys = {

    left:false,

    right:false

};

const gravity = 0.8;

const jumpPower = 15;

const acceleration = 0.8;

const friction = 0.8;

const maxSpeed = 7;


/* =====================================
   JOUER
===================================== */

play.addEventListener(
"pointerdown",
function(){

    startGame();

}
);


function startGame(){

    menu.classList.add("hidden");

    game.classList.remove("hidden");

    message.classList.add("hidden");

    x = 100;

    y = 75;

    velocityY = 0;

    velocityX = 0;

    cameraX = 0;

    lives = 3;

    coins = 0;

    score = 0;

    grounded = true;

    playing = true;

    updateHUD();

    requestAnimationFrame(loop);

}


/* =====================================
   CONTROLES
===================================== */

function pressLeft(e){

    e.preventDefault();

    keys.left = true;

}

function releaseLeft(e){

    e.preventDefault();

    keys.left = false;

}


function pressRight(e){

    e.preventDefault();

    keys.right = true;

}

function releaseRight(e){

    e.preventDefault();

    keys.right = false;

}


/* téléphone */

leftButton.addEventListener(
"pointerdown",
pressLeft
);

leftButton.addEventListener(
"pointerup",
releaseLeft
);

leftButton.addEventListener(
"pointercancel",
releaseLeft
);

leftButton.addEventListener(
"pointerleave",
releaseLeft
);


rightButton.addEventListener(
"pointerdown",
pressRight
);

rightButton.addEventListener(
"pointerup",
releaseRight
);

rightButton.addEventListener(
"pointercancel",
releaseRight
);

rightButton.addEventListener(
"pointerleave",
releaseRight
);


/* =====================================
   SAUT
===================================== */

function jump(){

    if(!playing) return;

    if(grounded){

        velocityY = jumpPower;

        grounded = false;

    }

}


jumpButton.addEventListener(
"pointerdown",
function(e){

    e.preventDefault();

    jump();

}
);


/* =====================================
   CLAVIER PC
===================================== */

document.addEventListener(
"keydown",
function(e){

    if(e.key === "ArrowLeft")
        keys.left = true;

    if(e.key === "ArrowRight")
        keys.right = true;

    if(
        e.key === " " ||
        e.key === "ArrowUp"
    ){

        e.preventDefault();

        jump();

    }

}
);


document.addEventListener(
"keyup",
function(e){

    if(e.key === "ArrowLeft")
        keys.left = false;

    if(e.key === "ArrowRight")
        keys.right = false;

}
);


/* =====================================
   PLATEFORMES
===================================== */

function getPlatforms(){

    return [

        {
            x:450,
            y:190,
            w:220,
            h:28
        },

        {
            x:850,
            y:270,
            w:180,
            h:28
        },

        {
            x:1200,
            y:180,
            w:250,
            h:28
        },

        {
            x:1650,
            y:250,
            w:180,
            h:28
        },

        {
            x:2050,
            y:190,
            w:250,
            h:28
        },

        {
            x:2500,
            y:300,
            w:200,
            h:28
        }

    ];

}


/* =====================================
   COLLISION PLATEFORMES
===================================== */

function updatePhysics(){

    const oldY = y;

    velocityY -= gravity;

    y += velocityY;

    grounded = false;


    /* sol */

    if(y <= 75){

        y = 75;

        velocityY = 0;

        grounded = true;

    }


    /* plateformes */

    const platforms =
    getPlatforms();


    for(const p of platforms){

        const playerLeft = x;

        const playerRight = x + 55;

        const oldBottom = oldY;

        const newBottom = y;


        if(

            playerRight > p.x &&

            playerLeft < p.x + p.w &&

            oldBottom >= p.y &&

            newBottom <= p.y

        ){

            y = p.y;

            velocityY = 0;

            grounded = true;

        }

    }

}


/* =====================================
   ENNEMIS
===================================== */

const enemies = [

    {
        x:600,
        y:75,
        alive:true
    },

    {
        x:1100,
        y:75,
        alive:true
    },

    {
        x:1550,
        y:75,
        alive:true
    },

    {
        x:2200,
        y:75,
        alive:true
    }

];


function checkEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)
            continue;


        const dx =
        Math.abs(x - enemy.x);

        const dy =
        Math.abs(y - enemy.y);


        if(dx < 55 && dy < 55){

            /* saute dessus */

            if(velocityY < 0 && y > enemy.y + 25){

                enemy.alive = false;

                velocityY = jumpPower * .7;

                score += 100;

            }

            else{

                loseLife();

            }

        }

    }

}


/* =====================================
   PIECES
===================================== */

const coinsList = [

    {x:500,y:240,taken:false},

    {x:560,y:240,taken:false},

    {x:620,y:240,taken:false},

    {x:900,y:330,taken:false},

    {x:960,y:330,taken:false},

    {x:1300,y:230,taken:false},

    {x:1360,y:230,taken:false}

];


function checkCoins(){

    for(const coin of coinsList){

        if(coin.taken)
            continue;


        if(

            Math.abs(x - coin.x) < 40 &&

            Math.abs(y - coin.y) < 55

        ){

            coin.taken = true;

            coins++;

            score += 50;

            coinsElement.textContent =
            coins;

            /* cacher la pièce */

            const elements =
            document.querySelectorAll(".coin");

            for(const el of elements){

                const left =
                parseInt(el.style.left);

                if(
                    Math.abs(left - coin.x) < 2
                ){

                    el.style.display =
                    "none";

                    break;

                }

            }

        }

    }

}


/* =====================================
   VIE
===================================== */

function loseLife(){

    lives--;

    updateHUD();


    if(lives <= 0){

        endGame(false);

        return;

    }


    x = Math.max(
        100,
        x - 250
    );

    y = 75;

    velocityY = 0;

}


/* =====================================
   FIN
===================================== */

function endGame(win){

    playing = false;

    message.classList.remove("hidden");


    if(win){

        messageTitle.textContent =
        "🏆 NIVEAU TERMINÉ !";

        messageText.textContent =
        "Score : " + Math.floor(score);

    }

    else{

        messageTitle.textContent =
        "GAME OVER";

        messageText.textContent =
        "Score : " + Math.floor(score);

    }

}


/* =====================================
   HUD
===================================== */

function updateHUD(){

    livesElement.textContent =
    lives;

    coinsElement.textContent =
    coins;

    scoreElement.textContent =
    Math.floor(score);

}


/* =====================================
   CAMERA
===================================== */

function updateCamera(){

    const screenWidth =
    window.innerWidth;


    cameraX =
    x - screenWidth * .35;


    if(cameraX < 0)
        cameraX = 0;


    if(cameraX > 5000 - screenWidth)
        cameraX = 5000 - screenWidth;


    world.style.transform =
    "translateX(" + (-cameraX) + "px)";


}


/* =====================================
   JOUEUR
===================================== */

function updatePlayer(){

    player.style.left =
    x + "px";

    player.style.bottom =
    y + "px";

}


/* =====================================
   DEPLACEMENT
===================================== */

function updateMovement(){

    if(keys.left){

        velocityX -= acceleration;

    }

    if(keys.right){

        velocityX += acceleration;

    }


    if(!keys.left && !keys.right){

        velocityX *= friction;

    }


    velocityX =
    Math.max(
        -maxSpeed,
        Math.min(maxSpeed,velocityX)
    );


    x += velocityX;


    if(x < 0)
        x = 0;


    if(x > 4900)
        x = 4900;

}


/* =====================================
   BOUCLE
===================================== */

function loop(){

    if(!playing)
        return;


    updateMovement();

    updatePhysics();

    checkEnemies();

    checkCoins();

    updatePlayer();

    updateCamera();

    score += .05;

    updateHUD();


    /* arrivée */

    if(x >= 3000){

        endGame(true);

        return;

    }


    requestAnimationFrame(loop);

}


/* =====================================
   REJOUER
===================================== */

restart.addEventListener(
"pointerdown",
function(){

    startGame();

}
);

</script>

</body>
</html>
